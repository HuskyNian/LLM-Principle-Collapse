# Write a description for your problem
description: |
  Select 5 sentinel nodes from the residence_hall network to approximate the full-network average state.
  The network has 217 nodes and 1839 edges. Node IDs are 1-based integers from 1 to 217.
  Node feature columns: id, degree k, average nearest-neighbor degree knn, local clustering lcl, closeness centrality cc, betweenness centrality bc, k-core index kcore.
  Metric meanings and ranges for this network:
  - k: degree, the number of direct neighbors of the node. Range: 2 to 56.
  - knn: average degree of the node's direct neighbors. Range: 10.875 to 33.600.
  - lcl: local clustering coefficient; higher means the node's neighbors are more mutually connected. Range: 0.000 to 1.000.
  - cc: closeness centrality; higher means shorter average distance to all other nodes. Range: 0.293 to 0.545.
  - bc: betweenness centrality; higher means the node lies on more shortest paths and may act as a bridge. Range: 0.000 to 0.066.
  - kcore: core number/coreness; higher means the node belongs to a denser network core. Range: 2 to 11.
  These metrics are descriptive structural features, not direct optimization targets. A good sentinel set should minimize approximation error rather than simply choosing nodes with the largest value of any single metric.
  Node features:
